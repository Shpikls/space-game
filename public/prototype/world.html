<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прототип мира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6eaf3; --surface:#f6f8fc; --ink:#17203a; --muted:#59648a; --line:#c6cfe2;
  --accent:#17867d; --accent-ink:#ffffff; --warn:#b4471a; --warn-ink:#ffffff;
  --heavy:#c97f12; --light:#d23b63; --high:#1f8a55; --mid:#b07a0c; --low:#c4314f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a35; --surface:#18223f; --ink:#e5eaf6; --muted:#97a2c2; --line:#2a3760;
    --accent:#5fd8cb; --accent-ink:#0e1631; --warn:#fb8a4c; --warn-ink:#1b1206;
    --heavy:#f0a640; --light:#ff6f91; --high:#5fd39a; --mid:#f2c14e; --low:#ff6f7d;
  }
}
:root[data-theme="dark"]{
  --bg:#121a35; --surface:#18223f; --ink:#e5eaf6; --muted:#97a2c2; --line:#2a3760;
  --accent:#5fd8cb; --accent-ink:#0e1631; --warn:#fb8a4c; --warn-ink:#1b1206;
  --heavy:#f0a640; --light:#ff6f91; --high:#5fd39a; --mid:#f2c14e; --low:#ff6f7d;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Exo 2","Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
.stage{position:relative;min-height:0;background:#0e1631;touch-action:none;overflow:hidden}
.stage canvas{position:absolute;inset:0;display:block}
.panel{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:1fr}
  .panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--surface);padding:14px;gap:12px}
}
.btn{font:inherit;font-weight:600;font-size:13px;line-height:1.2;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.btn kbd{font:inherit;font-size:11px;font-weight:500;color:var(--muted)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on kbd{color:inherit;opacity:.75}
.btn.warn{background:var(--warn);color:var(--warn-ink);border-color:var(--warn)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.42;cursor:not-allowed}
@media (hover:none){.btn kbd{display:none}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.distrow{display:grid;grid-template-columns:repeat(3,1fr) 1.6fr;gap:6px}
.distrow .btn{min-height:36px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tcard{font-size:13px;min-height:52px}
.tcard .thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tcard .thead b{font-size:14px}
.hits{list-style:none;margin:4px 0 0;padding:0;display:flex;gap:6px}
.hits li{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:0 6px;padding:5px 7px;border:1px solid var(--line);border-radius:9px}
.hits .wname{font-weight:600}
.hits .pct{font-weight:700}
.hits .why{grid-column:1 / -1;font-size:11px;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.log{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:2px}
.log li{display:grid;grid-template-columns:38px 1fr;gap:6px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log li:nth-child(n+3){display:none}
@media (min-width:900px){ .log li:nth-child(n+3){display:grid} .log{font-size:13px} }
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;line-height:1.5;vertical-align:1px}
.sec-high{color:var(--high)} .sec-mid{color:var(--mid)} .sec-low{color:var(--low)}
.overlay{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(8,12,28,.74);padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 12px);z-index:10}
.overlay.show{display:flex}
.card{background:var(--surface);color:var(--ink);border-radius:16px;max-width:600px;width:100%;padding:16px 14px 18px;margin:auto 0;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.card h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.card h2{margin:16px 0 8px;font-size:15px;font-weight:700}
.card p{margin:0 0 8px}
.sthead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wallet{text-align:right;font-size:13px;color:var(--muted);flex:none}
.wallet b{display:block;font-size:17px;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 4px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-top:8px}
.item .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item .row b{font-size:15px}
.item ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.item li span{display:block;font-size:12px;color:var(--muted)}
.item .btn{margin-top:8px;width:100%}
.reward{font-weight:700}
.tag::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.tag.heavy::before{background:var(--heavy)}
.tag.light::before{background:var(--light)}
.slot{margin-top:10px}
.slot > span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.btn.opt{align-items:flex-start;text-align:left;padding:7px 9px;min-height:44px}
.btn.opt small{font-weight:400;font-size:11px;color:var(--muted);line-height:1.3}
.btn.opt.on small{color:inherit;opacity:.85}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:6px}
.stats b{font-weight:700}
.note{font-size:13px;color:var(--warn);margin-top:6px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.actions .btn{min-height:48px;font-size:15px}
.navmap{width:100%;height:auto;display:block;margin-top:10px;border-radius:12px;background:#0e1631}
.dest{display:flex;flex-direction:column;gap:6px}
.dest .btn{flex-direction:row;justify-content:space-between;padding:8px 12px;min-height:46px;font-size:14px}
.dest .btn small{font-weight:400;color:var(--muted);font-size:12px}
.dest .btn.on small{color:inherit}
.linkbtn{font:inherit;font-size:13px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0;margin-top:12px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.zb{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(14,22,49,.72);color:#dfe6f5;font:600 21px/1 "Exo 2",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zb:focus-visible{outline:2px solid #6ee7d8;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="cv" aria-label="Космос"></canvas>
    <div class="zoom"><button class="zb" data-z="in" aria-label="Приблизить">+</button><button class="zb" data-z="out" aria-label="Отдалить">−</button></div>
  </div>
  <aside class="panel">
    <div class="grid3" id="orders">
      <button class="btn" data-order="orbit">Орбита<kbd>1</kbd></button>
      <button class="btn" data-order="keep">Дистанция<kbd>2</kbd></button>
      <button class="btn" data-order="approach">Сближение<kbd>3</kbd></button>
      <button class="btn" data-order="away">Отход<kbd>4</kbd></button>
      <button class="btn" data-order="stop">Стоп<kbd>5</kbd></button>
      <button class="btn" data-order="mine" id="mineBtn">Добывать<kbd>6</kbd></button>
    </div>
    <div class="distrow">
      <button class="btn" data-dist="250" aria-label="Дистанция 250 м">250 м<kbd>Q</kbd></button>
      <button class="btn" data-dist="450" aria-label="Дистанция 450 м">450 м<kbd>W</kbd></button>
      <button class="btn" data-dist="700" aria-label="Дистанция 700 м">700 м<kbd>E</kbd></button>
      <button class="btn" id="navBtn">Навигация<kbd>N</kbd></button>
    </div>
    <div class="tcard" id="target"></div>
    <ol class="log" id="log"></ol>
  </aside>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d'), overlay = $('#overlay');

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ================= data ================= */
const TIME_SCALE = 0.7, SIG_BASE = 60;
const WEAP = {
  kinetic:{ id:'kinetic', name:'Рельса', dmg:26, cycle:2.0, optimal:700, falloff:250, tracking:0.18, color:'#ffe08a' },
  energy: { id:'energy',  name:'Лазер',  dmg:18, cycle:1.4, optimal:420, falloff:120, tracking:0.9,  color:'#c4a0ff' }
};
const MINER = { cycle:5, yield:3, range:250, color:'#7ee0a1' };
const MULT = { kinetic:{ armor:1.5, hull:0.8 }, energy:{ armor:0.6, hull:1.5 } };
const ENEMY = {
  heavy:{ name:'Тяжёлый', maxSpeed:85, accel:35, sig:120, armor:250, hull:150, ai:'keep', range:550, size:13, color:'#f0a640',
          weapon:{ id:'kinetic', name:'Рельса', dmg:18, cycle:2.2, optimal:650, falloff:200, tracking:0.3, color:'#ffe08a' } },
  light:{ name:'Перехватчик', maxSpeed:200, accel:260, sig:40, armor:0, hull:140, ai:'orbit', range:270, size:7, color:'#ff6f91',
          weapon:{ id:'energy', name:'Лазер', dmg:10, cycle:1.2, optimal:280, falloff:80, tracking:1.2, color:'#ff9db4' } }
};
const SEC = { high:{ label:'Безопасно', cls:'sec-high', color:'#5fd39a' }, mid:{ label:'Умеренно', cls:'sec-mid', color:'#f2c14e' }, low:{ label:'Опасно', cls:'sec-low', color:'#ff6f7d' } };
const SYSTEMS = {
  alpha:{ name:'Альфа',  sec:'high', station:'Альфа-Порт',  belt:{ ferite:1 },                 rich:0.8, pirate:0,    links:['beta','gamma'],          pos:[16,50] },
  beta: { name:'Бета',   sec:'high', station:null,          belt:{ ferite:1 },                 rich:1.2, pirate:0.08, links:['alpha','gamma'],         pos:[40,16] },
  gamma:{ name:'Гамма',  sec:'mid',  station:'Гамма-Кузня', belt:{ ferite:0.7, indarite:0.3 }, rich:1.0, pirate:0.3,  links:['alpha','beta','delta'],  pos:[60,56] },
  delta:{ name:'Дельта', sec:'low',  station:null,          belt:{ ferite:0.3, indarite:0.7 }, rich:1.3, pirate:0.55, links:['gamma'],                 pos:[86,26] }
};
const ORES = { ferite:{ name:'Ферит', short:'ферит', color:'#b8c2d6' }, indarite:{ name:'Индарит', short:'индарит', color:'#b48cff' } };
const PRICES = { alpha:{ ferite:10, indarite:38 }, gamma:{ ferite:8, indarite:52 } };
const SHIPS = {
  frigate:{ name:'Фрегат «Стриж»', hull:250, speed:230, accel:170, sig:45,  slots:{ weapon:2, def:1, util:1 }, cargo:50,  price:0, plate:150,     size:9,
            desc:'Лёгкий и быстрый. Перехватчикам трудно по нему попасть, но тяжёлый бой ему не по силам. Бесплатный: после потери выдаётся снова.' },
  cruiser:{ name:'Крейсер «Кондор»', hull:650, speed:150, accel:85, sig:110, slots:{ weapon:3, def:2, util:1 }, cargo:120, price:12000, plate:350, size:14,
            desc:'Тяжёлый и медленный. Три оружия, две плиты, большой трюм. Крупная мишень для тяжёлых пушек. Потерял — покупай заново.' }
};
const MODULES = {
  kinetic: { kind:'weapon', name:'Рельса',            price:0,    desc:'Кинетика, 700 м, сильна по броне' },
  energy:  { kind:'weapon', name:'Лазер',             price:0,    desc:'Энергетика, 420 м, силён по корпусу' },
  miner:   { kind:'weapon', name:'Буровой лазер',     price:800,  desc:'Добыча руды на 250 м' },
  plate:   { kind:'def',    name:'Броневая плита',    price:0,    desc:'Броня: +150 фрегату, +350 крейсеру; −15% скорости' },
  repair:  { kind:'util',   name:'Ремонт брони',      price:1500, desc:'+30 брони каждые 4 с' },
  boost:   { kind:'util',   name:'Форсаж',            price:1200, desc:'+30% скорости' },
  cargoext:{ kind:'util',   name:'Расширитель трюма', price:1000, desc:'+60% трюма' },
  none:    { kind:'any',    name:'Пусто',             price:0,    desc:'' }
};
const OPTIONS = { weapon:['kinetic','energy','miner'], def:['plate','none'], util:['none','repair','boost','cargoext'] };
const SLOT_LABEL = { weapon:'Оружие', def:'Защита', util:'Вспомогательный' };
const COL = { space:'#0e1631', dot:'#2b3b6e', player:'#6ee7d8', armor:'#8fa9cf', hull:'#eef2f9', text:'#dfe6f5', muted:'#8e9bc0', miss:'#9aa6c4', hurt:'#ff8a8a', heal:'#7ee0a1', warp:'#9be8ff' };

/* ================= helpers ================= */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b - a) * t;
const dist = (a,b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = (a,b) => a + Math.random() * (b - a);
const fmtNum = n => Math.round(n).toLocaleString('ru-RU');
const fmtTime = t => { const s = Math.floor(t); return Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0'); };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ================= game state ================= */
function newGame(){
  return { v:1, credits:1500, sys:'alpha', lastStation:'alpha', docked:true,
    ships:{ frigate:true, cruiser:false }, active:'frigate',
    fits:{ frigate:{ weapon:['kinetic','energy'], def:['plate'], util:['none'] },
           cruiser:{ weapon:['kinetic','kinetic','energy'], def:['plate','plate'], util:['none'] } },
    owned:{ kinetic:true, energy:true, plate:true, none:true },
    cargo:{ ferite:0, indarite:0 }, boards:{}, mission:null, mid:0 };
}
let game = (() => {
  const g = store.get('sgw.game', null);
  if (g && g.v === 1){ g.docked = true; g.sys = g.lastStation || 'alpha'; return g; }
  return newGame();
})();
function save(){ store.set('sgw.game', game); }

let pl = null, scene = null, warp = null, banner = null;
const order = { type:'stop', dist:450 };
let logs = [], logDirty = true, stationTab = 'missions', resetArm = false, flash = '';
let cssW = 0, cssH = 0, dpr = 1, sc = 0.15, cam = { x:0, y:0 };
let viewSpan = clamp(Number(store.get('sgw.zoom', 2800)) || 2800, 1200, 5000);
function setZoom(v){ viewSpan = clamp(v, 1200, 5000); store.set('sgw.zoom', Math.round(viewSpan)); }

function log(text){ logs.unshift({ t: scene ? scene.time : 0, text }); if (logs.length > 40) logs.pop(); logDirty = true; }
const cargoUsed = () => game.cargo.ferite + game.cargo.indarite;

function shipStats(id){
  const S = SHIPS[id], f = game.fits[id];
  let speed = S.speed, accel = S.accel, armor = 0, cargo = S.cargo, repair = false;
  for (const d of f.def) if (d === 'plate'){ armor += S.plate; speed *= 0.85; accel *= 0.85; }
  for (const u of f.util){ if (u === 'boost'){ speed *= 1.3; accel *= 1.2; } if (u === 'cargoext') cargo = Math.round(cargo * 1.6); if (u === 'repair') repair = true; }
  return { speed, accel, armor, cargo, repair: repair && armor > 0, hull:S.hull, sig:S.sig, size:S.size,
    weapons: f.weapon.filter(w => w === 'kinetic' || w === 'energy'), miners: f.weapon.filter(w => w === 'miner').length };
}
function buildPlayer(){
  const st = shipStats(game.active);
  return { side:'player', label:'Ты', x:0, y:0, vx:0, vy:0, angle:-Math.PI/2, maxSpeed:st.speed, accel:st.accel, sig:st.sig, size:st.size,
    hullMax:st.hull, hull:st.hull, armorMax:st.armor, armor:st.armor, color:COL.player, cargoMax:st.cargo,
    turrets: st.weapons.map((w, i) => ({ w:WEAP[w], cd:0.3 + i*0.5 })),
    miners: Array.from({ length:st.miners }, (_, i) => ({ cd: MINER.cycle * (0.4 + i*0.2) })),
    repair:st.repair, repairT:4, target:null, mineTarget:null, dead:false, armorBroken:false, ship:game.active };
}

/* ================= missions ================= */
const TITLES = ['Пиратская засада', 'Зачистка маршрута', 'Логово налётчиков', 'Перехват контрабандистов', 'Сигнал бедствия', 'Охота за наградой'];
function genMission(){
  const r = Math.random(); let level, sys, comp, reward;
  if (r < 0.5){ level = 1; sys = pick(['alpha','beta']); comp = pick([{ light:3 }, { heavy:2 }]); reward = rnd(1200, 1700); }
  else if (r < 0.85){ level = 2; sys = 'gamma'; comp = pick([{ light:5 }, { heavy:3 }, { heavy:2, light:2 }]); reward = rnd(3000, 4200); }
  else { level = 3; sys = 'delta'; comp = pick([{ heavy:3, light:4 }, { heavy:4, light:2 }]); reward = rnd(7000, 9500); }
  return { id: ++game.mid, level, sys, comp:{ heavy:comp.heavy || 0, light:comp.light || 0 }, reward: Math.round(reward / 50) * 50, title: pick(TITLES) };
}
function ensureBoard(st){ const b = game.boards[st] || (game.boards[st] = []); while (b.length < 3) b.push(genMission()); }
function enemyLines(comp){
  const rows = [];
  if (comp.heavy) rows.push('<li><b class="tag heavy">Тяжёлые бронированные: ' + comp.heavy + '</b><span>Медленные, держатся на дистанции, бьют кинетикой. Плохо попадают по быстрым целям вблизи. Против них — рельсы.</span></li>');
  if (comp.light) rows.push('<li><b class="tag light">Перехватчики: ' + comp.light + '</b><span>Быстрые, без брони, кружат вплотную и жгут лазерами. Против них — лазеры и броня.</span></li>');
  return '<ul>' + rows.join('') + '</ul>';
}
const secBadge = sys => '<span class="badge ' + SEC[SYSTEMS[sys].sec].cls + '">' + SEC[SYSTEMS[sys].sec].label + '</span>';

/* ================= scenes ================= */
function makeScene(kind){
  scene = { kind, sys:game.sys, enemies:[], asteroids:[], shots:[], floats:[], booms:[], time: scene ? scene.time : 0, pirateT:15, count:{}, fullLogged:false, done:false };
  pl.x = 0; pl.y = 0; pl.vx = 0; pl.vy = 0; pl.target = null; pl.mineTarget = null;
  if (kind === 'belt') genBelt();
  if (kind === 'mission') genSite();
}
function genBelt(){
  const S = SYSTEMS[game.sys];
  for (let i = 0; i < 11; i++){
    const a = Math.random() * Math.PI * 2, d = rnd(450, 1500);
    const type = Math.random() < (S.belt.indarite || 0) ? 'indarite' : 'ferite';
    const ore = Math.round((type === 'ferite' ? rnd(40, 80) : rnd(15, 35)) * S.rich);
    const verts = Array.from({ length:9 }, () => rnd(0.72, 1.15));
    scene.asteroids.push({ x:Math.cos(a)*d, y:Math.sin(a)*d, vx:0, vy:0, type, ore, oreMax:ore, verts, rot:Math.random()*6 });
  }
}
function genSite(){
  const m = game.mission;
  for (let i = 0; i < m.comp.heavy; i++) spawn('heavy', 1600, 1900);
  for (let i = 0; i < m.comp.light; i++) spawn('light', 1450, 1700);
  scene.missionId = m.id;
}
function spawn(type, dmin, dmax, warpIn){
  const T = ENEMY[type];
  const a = Math.random() * Math.PI * 2, d = rnd(dmin, dmax);
  scene.count[type] = (scene.count[type] || 0) + 1;
  const e = { side:'enemy', type, label: T.name + ' ' + scene.count[type], x: pl.x + Math.cos(a)*d, y: pl.y + Math.sin(a)*d,
    vx:0, vy:0, angle:a + Math.PI, maxSpeed: T.maxSpeed * rnd(0.9, 1.1), accel:T.accel, sig:T.sig,
    armorMax:T.armor, armor:T.armor, hullMax:T.hull, hull:T.hull, w:T.weapon, cd: rnd(1, 2.5),
    ai:T.ai, range: T.range + rnd(-30, 30), dir: Math.random() < 0.5 ? 1 : -1, size:T.size, color:T.color, dead:false };
  scene.enemies.push(e);
  if (warpIn) scene.booms.push({ x:e.x, y:e.y, t:0, life:0.8, color:COL.warp, size:30 });
}
function spawnPirates(){
  const sec = SYSTEMS[scene.sys].sec;
  if (sec === 'high'){ spawn('light', 1100, 1300, true); }
  else if (sec === 'mid'){ if (Math.random() < 0.5){ spawn('light', 1100, 1300, true); spawn('light', 1100, 1300, true); } else spawn('heavy', 1200, 1400, true); }
  else { spawn('heavy', 1200, 1400, true); spawn('heavy', 1200, 1400, true); spawn('light', 1100, 1300, true); spawn('light', 1100, 1300, true); }
  log('Пираты в поясе: ' + scene.enemies.length);
}

/* ================= movement & combat ================= */
function steer(s, des, dt){
  let dx = des[0], dy = des[1];
  const m = Math.hypot(dx, dy);
  if (m > s.maxSpeed){ dx = dx/m*s.maxSpeed; dy = dy/m*s.maxSpeed; }
  let ax = dx - s.vx, ay = dy - s.vy;
  const am = Math.hypot(ax, ay), lim = s.accel * dt;
  if (am > lim){ ax = ax/am*lim; ay = ay/am*lim; }
  s.vx += ax; s.vy += ay; s.x += s.vx * dt; s.y += s.vy * dt;
  if (Math.hypot(s.vx, s.vy) > 4) s.angle = Math.atan2(s.vy, s.vx);
}
function orbitDesired(s, t, R, dir){
  let rx = s.x - t.x, ry = s.y - t.y; const d = Math.hypot(rx, ry) || 1; rx /= d; ry /= d;
  const corr = clamp((d - R) / (R * 0.5), -1, 1);
  let vx = -ry*dir - rx*corr*1.5, vy = rx*dir - ry*corr*1.5;
  const m = Math.hypot(vx, vy) || 1;
  return [vx/m*s.maxSpeed, vy/m*s.maxSpeed];
}
function keepDesired(s, t, R){
  let rx = s.x - t.x, ry = s.y - t.y; const d = Math.hypot(rx, ry) || 1; rx /= d; ry /= d;
  const k = clamp((d - R) / 120, -1, 1);
  return [t.vx - rx*k*s.maxSpeed, t.vy - ry*k*s.maxSpeed];
}
function playerDesired(p){
  if (order.type === 'mine'){
    const a = p.mineTarget; if (!a) return [0, 0];
    const d = dist(p, a) || 1;
    return d > 150 ? [(a.x-p.x)/d*p.maxSpeed, (a.y-p.y)/d*p.maxSpeed] : [0, 0];
  }
  const t = p.target;
  if (!t) return order.type === 'away' ? [p.vx, p.vy] : [0, 0];
  const d = dist(p, t) || 1;
  switch (order.type){
    case 'orbit': return orbitDesired(p, t, order.dist, 1);
    case 'keep': return keepDesired(p, t, order.dist);
    case 'approach': return d > 130 ? [(t.x-p.x)/d*p.maxSpeed, (t.y-p.y)/d*p.maxSpeed] : [t.vx, t.vy];
    case 'away': return [(p.x-t.x)/d*p.maxSpeed, (p.y-t.y)/d*p.maxSpeed];
    default: return [0, 0];
  }
}
const enemyDesired = (e, p) => e.ai === 'keep' ? keepDesired(e, p, e.range) : orbitDesired(e, p, e.range, e.dir);

function hitInfo(s, t, w){
  const dx = t.x - s.x, dy = t.y - s.y, d = Math.hypot(dx, dy) || 1, rx = dx/d, ry = dy/d;
  const trans = Math.abs(rx*(t.vy - s.vy) - ry*(t.vx - s.vx)), ang = trans / d;
  const tt = (ang / w.tracking) * (SIG_BASE / t.sig), rt = Math.max(0, d - w.optimal) / w.falloff;
  const tf = Math.pow(0.5, tt*tt), rf = Math.pow(0.5, rt*rt), chance = tf * rf;
  const inRange = d <= w.optimal + 2.5 * w.falloff;
  let reason;
  if (!inRange) reason = 'вне досягаемости';
  else if (chance > 0.75) reason = 'хорошие условия';
  else if (tf < rf) reason = 'цель быстро смещается';
  else reason = 'цель далеко';
  return { chance, reason, inRange };
}
function applyDamage(t, raw, type){
  const m = MULT[type]; let a = 0, h = 0;
  if (t.armor > 0){
    const ad = raw * m.armor;
    if (ad <= t.armor){ t.armor -= ad; a = ad; }
    else { a = t.armor; t.armor = 0; h = (ad - a) / m.armor * m.hull; t.hull -= h; }
  } else { h = raw * m.hull; t.hull -= h; }
  if (t.hull <= 0){ t.hull = 0; t.dead = true; }
  return { armor:a, hull:h };
}
function addFloat(ent, text, color){ scene.floats.push({ x:ent.x, y:ent.y, jx:rnd(-8, 8), text, color, t:0, life:1.2 }); }
function fire(s, t, w){
  const h = hitInfo(s, t, w), hit = Math.random() < h.chance;
  let ex = t.x, ey = t.y;
  if (!hit){ const a = Math.random()*Math.PI*2, off = rnd(45, 95); ex += Math.cos(a)*off; ey += Math.sin(a)*off; }
  scene.shots.push({ x1:s.x, y1:s.y, x2:ex, y2:ey, color:w.color, kind:w.id, t:0, life: w.id === 'energy' ? 0.22 : 0.3 });
  const toPlayer = t.side === 'player';
  if (hit){
    const res = applyDamage(t, w.dmg * rnd(0.85, 1.15), w.id), n = Math.round(res.armor + res.hull);
    addFloat(t, toPlayer ? '−' + n : String(n), toPlayer ? COL.hurt : (res.hull > 0 ? COL.hull : COL.armor));
    if (toPlayer && t.armorMax > 0 && t.armor <= 0 && !t.armorBroken){ t.armorBroken = true; log('Броня пробита, урон идёт в корпус'); }
    if (t.dead){
      if (toPlayer){ lose(); return; }
      scene.booms.push({ x:t.x, y:t.y, t:0, life:0.7, color:t.color, size:t.size * 3.2 });
      log(t.label + ' уничтожен');
    }
  } else addFloat(t, 'мимо', COL.miss);
}
function nearestEnemy(){
  let b = null, bd = Infinity;
  for (const e of scene.enemies){ if (e.dead) continue; const d = dist(pl, e); if (d < bd){ bd = d; b = e; } }
  return b;
}
function nearestAsteroid(maxD){
  let b = null, bd = maxD || Infinity;
  for (const a of scene.asteroids){ if (a.ore <= 0) continue; const d = dist(pl, a); if (d < bd){ bd = d; b = a; } }
  return b;
}

/* ================= update ================= */
const age = (arr, dt) => { for (const x of arr) x.t += dt; return arr.filter(x => x.t < x.life); };

function update(dt){
  if (banner){ banner.t += dt; if (banner.t > banner.life) banner = null; }
  if (warp){ updateWarp(dt); if (!pl || !scene || (warp && warp.phase === 'jump')) return; }
  const S = scene, p = pl;
  S.time += dt;
  if (!p.target || p.target.dead) p.target = nearestEnemy();
  if (!p.mineTarget || p.mineTarget.ore <= 0) p.mineTarget = order.type === 'mine' ? nearestAsteroid() : null;
  steer(p, playerDesired(p), dt);
  for (const e of S.enemies) if (!e.dead) steer(e, enemyDesired(e, p), dt);

  for (const tr of p.turrets){
    tr.cd -= dt;
    if (tr.cd <= 0){
      const t = p.target;
      if (t && !t.dead && dist(p, t) <= tr.w.optimal + 2.5*tr.w.falloff){ fire(p, t, tr.w); tr.cd = tr.w.cycle; }
      else tr.cd = 0;
    }
  }
  for (const m of p.miners){
    m.cd -= dt;
    if (m.cd > 0) continue;
    const a = (p.mineTarget && p.mineTarget.ore > 0 && dist(p, p.mineTarget) <= MINER.range) ? p.mineTarget : nearestAsteroid(MINER.range);
    if (!a){ m.cd = 0.5; continue; }
    m.cd = MINER.cycle;
    const free = p.cargoMax - cargoUsed();
    if (free <= 0){ if (!S.fullLogged){ log('Трюм полон, пора продавать'); S.fullLogged = true; } continue; }
    const q = Math.min(MINER.yield, a.ore, free);
    a.ore -= q; game.cargo[a.type] += q;
    S.shots.push({ x1:p.x, y1:p.y, x2:a.x, y2:a.y, color:MINER.color, kind:'mine', t:0, life:0.7 });
    addFloat(a, '+' + q + ' ' + ORES[a.type].short, ORES[a.type].color);
    if (a.ore <= 0) log('Астероид выработан');
  }
  for (const e of S.enemies){
    if (e.dead) continue;
    e.cd -= dt;
    if (e.cd <= 0){
      if (dist(e, p) <= e.w.optimal + 2.5*e.w.falloff){ fire(e, p, e.w); e.cd = e.w.cycle * rnd(0.9, 1.1); }
      else e.cd = 0.3;
    }
    if (!pl) return;
  }
  if (p.repair){
    p.repairT -= dt;
    if (p.repairT <= 0){
      p.repairT = 4;
      if (p.armor < p.armorMax){ const b = p.armor; p.armor = Math.min(p.armorMax, p.armor + 30); if (p.armor > 0) p.armorBroken = false; addFloat(p, '+' + Math.round(p.armor - b), COL.heal); }
    }
  }
  S.shots = age(S.shots, dt); S.floats = age(S.floats, dt); S.booms = age(S.booms, dt);
  S.enemies = S.enemies.filter(e => !e.dead);
  if (S.kind === 'belt'){
    S.pirateT -= dt;
    if (S.pirateT <= 0){ S.pirateT = 25; if (S.enemies.length === 0 && Math.random() < SYSTEMS[S.sys].pirate) spawnPirates(); }
  }
  if (S.kind === 'mission' && !S.done && S.enemies.length === 0 && game.mission && game.mission.id === S.missionId){
    S.done = true;
    const m = game.mission;
    game.credits += m.reward; game.mission = null; save();
    log('Задание выполнено: +' + fmtNum(m.reward) + ' кр');
    banner = { text:'Задание выполнено  +' + fmtNum(m.reward) + ' кр', t:0, life:3.5 };
  }
}

/* ================= travel ================= */
function startWarp(dest){
  if (warp || !pl) return;
  warp = Object.assign({ phase:'spool', t:4 }, dest);
  log(dest.type === 'jump' ? 'Разгон к прыжку в ' + SYSTEMS[dest.sys].name + ': 4 с' : 'Варп: ' + dest.label + ', 4 с');
}
function cancelWarp(){ if (warp && warp.phase === 'spool'){ warp = null; log('Варп отменён'); } }
function updateWarp(dt){
  warp.t -= dt;
  if (warp.t > 0) return;
  if (warp.phase === 'spool'){
    if (warp.type === 'jump'){ warp.phase = 'jump'; warp.t = 3; scene.enemies = []; scene.shots = []; return; }
    const loc = warp.loc; warp = null;
    if (loc === 'station'){ dock(); return; }
    makeScene(loc);
    log(loc === 'belt' ? 'Пояс астероидов' : 'Место задания: ' + (game.mission ? game.mission.title : ''));
    if (loc === 'belt' && pl.miners.length) order.type = 'mine';
    return;
  }
  game.sys = warp.sys; warp = null;
  makeScene('space');
  log('Прибыл в систему ' + SYSTEMS[game.sys].name);
}
function dock(){
  game.docked = true; game.lastStation = game.sys; pl = null; scene = null; warp = null;
  ensureBoard(game.sys); save();
  log('Стыковка: ' + SYSTEMS[game.sys].station);
  showStation();
}
function undock(){
  game.docked = false; pl = buildPlayer();
  scene = null; makeScene('station'); order.type = 'stop';
  hideOverlay(); log('Вылет: ' + SYSTEMS[game.sys].station);
}
function lose(){
  const ship = SHIPS[game.active].name, cargo = cargoUsed(), wasCruiser = game.active === 'cruiser';
  game.cargo = { ferite:0, indarite:0 };
  if (wasCruiser){ game.ships.cruiser = false; game.active = 'frigate'; }
  game.sys = game.lastStation; game.docked = true; pl = null; scene = null; warp = null;
  save();
  showOverlay('<h1>Корабль потерян</h1><p class="muted">' + ship + ' уничтожен.' + (cargo ? ' Груз ' + cargo + ' ед. руды пропал.' : '') + (wasCruiser ? ' Крейсер придётся покупать заново.' : '') + '</p><p>Ты на станции ' + SYSTEMS[game.sys].station + ' на новом фрегате.</p><div class="actions"><button class="btn on" data-act="tostation">На станцию</button></div>');
}

/* ================= render ================= */
function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  cssW = Math.max(1, r.width); cssH = Math.max(1, r.height); dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
}
new ResizeObserver(resize).observe(cv.parentElement);
resize();
const toS = (x, y) => [cssW/2 + (x - cam.x)*sc, cssH/2 + (y - cam.y)*sc];

function drawShip(e, x, y){
  ctx.save(); ctx.translate(x, y); ctx.rotate(e.angle);
  ctx.fillStyle = e.color; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
  ctx.beginPath();
  const r = e.size;
  if (e.type === 'heavy'){ for (let i = 0; i < 6; i++){ const a = i*Math.PI/3; ctx.lineTo(Math.cos(a)*r*(i === 0 ? 1.3 : 1), Math.sin(a)*r); } }
  else if (e.type === 'light'){ ctx.moveTo(r*1.5, 0); ctx.lineTo(-r, r*0.85); ctx.lineTo(-r*0.4, 0); ctx.lineTo(-r, -r*0.85); }
  else if (e.ship === 'cruiser'){ ctx.moveTo(r*1.4, 0); ctx.lineTo(r*0.2, r*0.8); ctx.lineTo(-r, r*0.8); ctx.lineTo(-r*0.6, 0); ctx.lineTo(-r, -r*0.8); ctx.lineTo(r*0.2, -r*0.8); }
  else { ctx.moveTo(r*1.6, 0); ctx.lineTo(-r*1.1, r); ctx.lineTo(-r*0.5, 0); ctx.lineTo(-r*1.1, -r); }
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}
function barPair(x, y, w, e){
  if (e.armorMax > 0){ ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x, y, w, 3); ctx.fillStyle = COL.armor; ctx.fillRect(x, y, w * (e.armor / e.armorMax), 3); y += 4; }
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x, y, w, 3); ctx.fillStyle = COL.hull; ctx.fillRect(x, y, w * (e.hull / e.hullMax), 3);
}
function hudBar(x, y, w, label, v, max, color, txt){
  ctx.font = '500 11px "Exo 2", sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = COL.muted; ctx.fillText(label, x, y);
  ctx.textAlign = 'right'; ctx.fillStyle = COL.text; ctx.fillText(txt || (max > 0 ? Math.ceil(v) + ' / ' + max : 'нет'), x + w, y);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x, y + 4, w, 5);
  if (max > 0){ ctx.fillStyle = color; ctx.fillRect(x, y + 4, w * clamp(v / max, 0, 1), 5); }
}

function render(now){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.space; ctx.fillRect(0, 0, cssW, cssH);
  sc = Math.min(cssW, cssH) / viewSpan;
  if (pl){ cam.x = pl.x; cam.y = pl.y; }

  if (warp && warp.phase === 'jump'){
    const t = now / 1000;
    for (let i = 0; i < 70; i++){
      const a = i * 2.39996, base = ((i * 37) % 100) / 100, k = (base + t * 0.9) % 1;
      const r1 = 20 + k * Math.max(cssW, cssH) * 0.7, r2 = r1 + 18 + k * 60;
      ctx.strokeStyle = 'rgba(155,232,255,' + (0.2 + k * 0.6) + ')'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(cssW/2 + Math.cos(a)*r1, cssH/2 + Math.sin(a)*r1); ctx.lineTo(cssW/2 + Math.cos(a)*r2, cssH/2 + Math.sin(a)*r2); ctx.stroke();
    }
    ctx.fillStyle = COL.text; ctx.font = '600 15px "Exo 2", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Прыжок в систему ' + SYSTEMS[warp.sys].name, cssW/2, cssH/2 + 4);
    return;
  }

  const step = 150;
  const x0 = Math.floor((cam.x - cssW/2/sc) / step) * step, x1 = cam.x + cssW/2/sc;
  const y0 = Math.floor((cam.y - cssH/2/sc) / step) * step, y1 = cam.y + cssH/2/sc;
  ctx.fillStyle = COL.dot;
  for (let gx = x0; gx <= x1; gx += step) for (let gy = y0; gy <= y1; gy += step){ const [sx, sy] = toS(gx, gy); ctx.fillRect(sx - 1, sy - 1, 2, 2); }
  if (!pl || !scene) return;
  const S = scene, p = pl, [px, py] = toS(p.x, p.y);

  if (S.kind === 'station'){
    const [sx, sy] = toS(0, -420);
    ctx.strokeStyle = '#8fa9cf'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 22, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, sy, 34, -0.6, 0.6); ctx.stroke(); ctx.beginPath(); ctx.arc(sx, sy, 34, Math.PI - 0.6, Math.PI + 0.6); ctx.stroke();
    ctx.fillStyle = '#8fa9cf'; ctx.fillRect(sx - 5, sy - 5, 10, 10); ctx.lineWidth = 1;
    ctx.fillStyle = COL.muted; ctx.font = '500 11px "Exo 2", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(SYSTEMS[S.sys].station, sx, sy + 50);
  }

  for (const a of S.asteroids){
    const [ax, ay] = toS(a.x, a.y);
    if (ax < -30 || ay < -30 || ax > cssW + 30 || ay > cssH + 30) continue;
    const r = 5 + Math.sqrt(a.ore) * 1.3;
    ctx.fillStyle = a.type === 'indarite' ? '#5b4a86' : '#4d5670';
    ctx.strokeStyle = ORES[a.type].color; ctx.lineWidth = a === p.mineTarget ? 2 : 1;
    ctx.beginPath();
    a.verts.forEach((k, i) => { const ang = a.rot + i * Math.PI * 2 / a.verts.length; ctx.lineTo(ax + Math.cos(ang)*r*k, ay + Math.sin(ang)*r*k); });
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
  }

  const seen = new Set();
  ctx.setLineDash([4, 6]);
  for (const tr of p.turrets){
    if (seen.has(tr.w.id)) continue; seen.add(tr.w.id);
    const r = tr.w.optimal * sc;
    ctx.strokeStyle = tr.w.color; ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 0.55; ctx.fillStyle = tr.w.color; ctx.font = '500 10px "Exo 2", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(tr.w.name + ' ' + tr.w.optimal + ' м', px, py - r - 4);
  }
  if (p.miners.length && S.asteroids.length){ ctx.strokeStyle = MINER.color; ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(px, py, MINER.range * sc, 0, Math.PI*2); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.setLineDash([]);

  if (p.target && !p.target.dead){
    const [tx, ty] = toS(p.target.x, p.target.y);
    ctx.strokeStyle = 'rgba(110,231,216,.35)'; ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = COL.player; ctx.lineWidth = 1.5;
    const rr = p.target.size + 9, rot = S.time * 1.5;
    for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.arc(tx, ty, rr, rot + i*Math.PI/2, rot + i*Math.PI/2 + 0.8); ctx.stroke(); }
    ctx.lineWidth = 1;
  }

  for (const s of S.shots){
    const k = s.t / s.life, [x1s, y1s] = toS(s.x1, s.y1), [x2s, y2s] = toS(s.x2, s.y2);
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath();
    if (s.kind === 'kinetic'){ const a = Math.max(0, k - 0.3); ctx.moveTo(lerp(x1s, x2s, a), lerp(y1s, y2s, a)); ctx.lineTo(lerp(x1s, x2s, k), lerp(y1s, y2s, k)); }
    else { ctx.globalAlpha = 1 - k; ctx.moveTo(x1s, y1s); ctx.lineTo(x2s, y2s); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const b of S.booms){
    const k = b.t / b.life, [bx, by] = toS(b.x, b.y);
    ctx.strokeStyle = b.color; ctx.globalAlpha = 1 - k; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bx, by, 4 + b.size * k, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 1;

  const m = 18;
  for (const e of S.enemies){
    if (e.dead) continue;
    const [ex, ey] = toS(e.x, e.y);
    if (ex < -10 || ey < -10 || ex > cssW + 10 || ey > cssH + 10){
      const ang = Math.atan2(ey - py, ex - px), cx = clamp(ex, m, cssW - m), cy = clamp(ey, m, cssH - m);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, 5); ctx.lineTo(-5, -5); ctx.closePath(); ctx.fill(); ctx.restore();
      continue;
    }
    drawShip(e, ex, ey); barPair(ex - 15, ey - e.size - 12, 30, e);
  }
  drawShip(p, px, py);
  if (warp && warp.phase === 'spool'){
    const k = 1 - warp.t / 4;
    ctx.strokeStyle = COL.warp; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, 24, -Math.PI/2, -Math.PI/2 + Math.PI*2*k); ctx.stroke(); ctx.lineWidth = 1;
  }

  ctx.font = '600 12px "Exo 2", sans-serif'; ctx.textAlign = 'center';
  for (const f of S.floats){
    const k = f.t / f.life, [fx, fy] = toS(f.x, f.y);
    ctx.globalAlpha = 1 - k; ctx.fillStyle = f.color; ctx.fillText(f.text, fx + f.jx, fy - 18 - k * 26);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(14,22,49,.74)'; ctx.fillRect(8, 8, 150, 76);
  hudBar(16, 24, 134, 'Броня', p.armor, p.armorMax, COL.armor);
  hudBar(16, 48, 134, 'Корпус', p.hull, p.hullMax, COL.hull);
  hudBar(16, 72, 134, 'Трюм', cargoUsed(), p.cargoMax, '#7ee0a1', cargoUsed() + ' / ' + p.cargoMax);

  const sys = SYSTEMS[S.sys];
  ctx.fillStyle = 'rgba(14,22,49,.74)'; ctx.fillRect(cssW - 140, 8, 132, 52);
  ctx.textAlign = 'right'; ctx.font = '700 13px "Exo 2", sans-serif'; ctx.fillStyle = COL.text;
  ctx.fillText(sys.name, cssW - 16, 26);
  ctx.font = '600 11px "Exo 2", sans-serif'; ctx.fillStyle = SEC[sys.sec].color; ctx.fillText(SEC[sys.sec].label, cssW - 16, 40);
  ctx.fillStyle = COL.muted; ctx.font = '500 11px "Exo 2", sans-serif'; ctx.fillText(fmtNum(game.credits) + ' кр', cssW - 16, 54);

  if (banner){
    const k = banner.t / banner.life, a = k < 0.1 ? k / 0.1 : (k > 0.8 ? (1 - k) / 0.2 : 1);
    ctx.globalAlpha = a; ctx.fillStyle = 'rgba(14,22,49,.85)'; ctx.fillRect(cssW/2 - 150, cssH*0.3 - 22, 300, 36);
    ctx.fillStyle = '#7ee0a1'; ctx.font = '700 15px "Exo 2", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(banner.text, cssW/2, cssH*0.3 + 1);
    ctx.globalAlpha = 1;
  }
}

/* ================= panel ================= */
const orderBtns = [...document.querySelectorAll('[data-order]')];
const distBtns = [...document.querySelectorAll('[data-dist]')];
const navBtn = $('#navBtn'), mineBtn = $('#mineBtn'), targetEl = $('#target'), logEl = $('#log');
orderBtns.forEach(b => b.addEventListener('click', () => { if (!b.disabled){ order.type = b.dataset.order; if (pl) pl.mineTarget = null; updateUI(); } }));
distBtns.forEach(b => b.addEventListener('click', () => { order.dist = +b.dataset.dist; updateUI(); }));
navBtn.addEventListener('click', navAction);
function navAction(){ if (!pl) return; if (warp && warp.phase === 'spool') cancelWarp(); else if (!warp) showNav(); updateUI(); }

function targetHTML(){
  if (!pl || !scene) return '';
  if (warp && warp.phase === 'jump') return '<p class="muted">В прыжке.</p>';
  const p = pl, t = p.target;
  if (t && !t.dead){
    const layer = t.armor > 0 ? 'armor' : 'hull', seen = new Set(), hits = [];
    for (const tr of p.turrets){
      if (seen.has(tr.w.id)) continue; seen.add(tr.w.id);
      const h = hitInfo(p, t, tr.w);
      hits.push('<li><span class="wname">' + tr.w.name + '</span><span class="pct">' + (h.inRange ? Math.round(h.chance*100) + '%' : '—') + '</span><span class="why">' + h.reason + '; ×' + MULT[tr.w.id][layer] + ' по ' + (layer === 'armor' ? 'броне' : 'корпусу') + '</span></li>');
    }
    return '<div class="thead"><b style="color:' + (t.type === 'heavy' ? 'var(--heavy)' : 'var(--light)') + '">' + t.label + '</b><span class="muted">' + Math.round(dist(p, t)) + ' м · броня ' + Math.ceil(t.armor) + ' · корпус ' + Math.ceil(t.hull) + '</span></div>'
      + (hits.length ? '<ul class="hits">' + hits.join('') + '</ul>' : '<p class="muted">Нет оружия.</p>');
  }
  if (scene.kind === 'belt'){
    const a = p.mineTarget || nearestAsteroid();
    if (!p.miners.length) return '<p class="muted">Пояс астероидов. Для добычи нужен буровой лазер: его можно купить в ангаре станции.</p>';
    if (!a) return '<p class="muted">Пояс выработан.</p>';
    return '<div class="thead"><b style="color:' + ORES[a.type].color + '">' + ORES[a.type].name + '</b><span class="muted">' + a.ore + ' ед. · ' + Math.round(dist(p, a)) + ' м</span></div><p class="small muted">Трюм ' + cargoUsed() + ' из ' + p.cargoMax + '. Буровых лазеров: ' + p.miners.length + ', ' + MINER.yield + ' ед. за цикл каждый.</p>';
  }
  if (scene.kind === 'mission') return game.mission ? '<p class="muted">Ждём противника.</p>' : '<p class="muted">Задание выполнено. Можно лететь дальше.</p>';
  return '<p class="muted">Открой навигацию, чтобы выбрать, куда лететь.</p>';
}

function updateUI(){
  const inSpace = !!pl;
  orderBtns.forEach(b => b.classList.toggle('on', b.dataset.order === order.type));
  distBtns.forEach(b => b.classList.toggle('on', +b.dataset.dist === order.dist));
  mineBtn.disabled = !inSpace || !pl.miners.length;
  navBtn.disabled = !inSpace || (warp && warp.phase === 'jump');
  navBtn.classList.toggle('warn', !!(warp && warp.phase === 'spool'));
  navBtn.firstChild.textContent = warp ? (warp.phase === 'spool' ? 'Отмена ' + Math.max(0, warp.t).toFixed(1) + ' с' : 'Прыжок…') : 'Навигация';
  if (inSpace) targetEl.innerHTML = targetHTML();
  if (logDirty){ logEl.innerHTML = logs.slice(0, 8).map(l => '<li><time>' + fmtTime(l.t) + '</time><span>' + l.text + '</span></li>').join(''); logDirty = false; }
}

document.addEventListener('keydown', ev => {
  if (!pl || overlay.classList.contains('show')) return;
  const k = ev.key.toLowerCase();
  const map = { '1':'orbit', '2':'keep', '3':'approach', '4':'away', '5':'stop', '6':'mine' };
  const dmap = { 'q':250, 'й':250, 'w':450, 'ц':450, 'e':700, 'у':700 };
  if (map[k]){ if (map[k] !== 'mine' || pl.miners.length){ order.type = map[k]; pl.mineTarget = null; } updateUI(); }
  else if (dmap[k]){ order.dist = dmap[k]; updateUI(); }
  else if (k === 'n' || k === 'т') navAction();
  else if (ev.key === 'Tab' && scene){
    ev.preventDefault();
    const list = scene.enemies.filter(e => !e.dead).sort((a, b) => dist(pl, a) - dist(pl, b));
    if (list.length){ const i = list.indexOf(pl.target); pl.target = list[(i + 1) % list.length]; updateUI(); }
  }
});

const pts = new Map(); let pinchD = 0;
const pinchDist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
cv.addEventListener('pointerdown', ev => {
  pts.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if (pts.size === 2){ pinchD = pinchDist(); return; }
  if (pts.size > 1 || !pl || !scene) return;
  const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  let b = null, bd = 38;
  for (const e of scene.enemies){ if (e.dead) continue; const [x, y] = toS(e.x, e.y); const d = Math.hypot(x - mx, y - my); if (d < bd){ bd = d; b = e; } }
  if (b){ pl.target = b; updateUI(); return; }
  for (const a of scene.asteroids){ if (a.ore <= 0) continue; const [x, y] = toS(a.x, a.y); const d = Math.hypot(x - mx, y - my); if (d < bd){ bd = d; b = a; } }
  if (b && pl.miners.length){ pl.mineTarget = b; order.type = 'mine'; updateUI(); }
});
cv.addEventListener('pointermove', ev => {
  if (!pts.has(ev.pointerId)) return;
  pts.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if (pts.size === 2){ const d = pinchDist(); setZoom(viewSpan * pinchD / d); pinchD = d; }
});
const endPt = ev => { pts.delete(ev.pointerId); };
cv.addEventListener('pointerup', endPt); cv.addEventListener('pointercancel', endPt);
cv.addEventListener('wheel', ev => { ev.preventDefault(); setZoom(viewSpan * (1 + ev.deltaY * 0.0012)); }, { passive:false });
document.querySelectorAll('.zb').forEach(b => b.addEventListener('click', () => setZoom(viewSpan * (b.dataset.z === 'in' ? 0.8 : 1.25))));

/* ================= overlays ================= */
function showOverlay(html){ overlay.innerHTML = '<div class="card">' + html + '</div>'; overlay.classList.add('show'); }
function hideOverlay(){ overlay.classList.remove('show'); overlay.innerHTML = ''; }

function mapSVG(){
  const lines = [], nodes = [], done = new Set();
  for (const [id, s] of Object.entries(SYSTEMS)){
    for (const l of s.links){
      const key = [id, l].sort().join('-'); if (done.has(key)) continue; done.add(key);
      const t = SYSTEMS[l];
      lines.push('<line x1="' + s.pos[0] + '" y1="' + s.pos[1] + '" x2="' + t.pos[0] + '" y2="' + t.pos[1] + '" stroke="#2f4074" stroke-width="0.8"/>');
    }
  }
  for (const [id, s] of Object.entries(SYSTEMS)){
    const cur = id === game.sys, col = SEC[s.sec].color, [x, y] = s.pos;
    if (cur) nodes.push('<circle cx="' + x + '" cy="' + y + '" r="6.5" fill="none" stroke="#6ee7d8" stroke-width="1"/>');
    nodes.push('<circle cx="' + x + '" cy="' + y + '" r="3.6" fill="' + col + '"/>');
    if (s.station) nodes.push('<rect x="' + (x - 1.3) + '" y="' + (y - 1.3) + '" width="2.6" height="2.6" fill="#0e1631"/>');
    nodes.push('<text x="' + x + '" y="' + (y + 11) + '" font-size="5" text-anchor="middle" fill="#dfe6f5" font-family="Exo 2, sans-serif">' + s.name + '</text>');
    if (game.mission && game.mission.sys === id) nodes.push('<text x="' + (x + 5) + '" y="' + (y - 4) + '" font-size="6" font-weight="700" fill="#f2c14e" font-family="Exo 2, sans-serif">!</text>');
  }
  return '<svg class="navmap" viewBox="0 0 100 72" role="img" aria-label="Карта систем">' + lines.join('') + nodes.join('') + '</svg>';
}

function showNav(){
  const s = SYSTEMS[game.sys], local = [], jumps = [];
  if (s.station) local.push('<button class="btn" data-act="warp" data-loc="station"><span>Станция ' + s.station + '</span><small>стыковка</small></button>');
  if (s.belt) local.push('<button class="btn" data-act="warp" data-loc="belt"><span>Пояс астероидов</span><small>' + Object.keys(s.belt).map(o => ORES[o].short).join(', ') + '</small></button>');
  if (game.mission && game.mission.sys === game.sys) local.push('<button class="btn" data-act="warp" data-loc="mission"><span>Место задания</span><small>' + game.mission.title + '</small></button>');
  for (const l of s.links){ const t = SYSTEMS[l]; jumps.push('<button class="btn" data-act="jump" data-sys="' + l + '"><span>' + t.name + (t.station ? ' · станция' : '') + '</span><small class="' + SEC[t.sec].cls + '">' + SEC[t.sec].label + '</small></button>'); }
  showOverlay(
    '<div class="sthead"><div><h1>Навигация</h1><p class="muted">Система ' + s.name + ' ' + secBadge(game.sys) + '</p></div><div class="wallet"><b>' + fmtNum(game.credits) + ' кр</b><span>Трюм ' + cargoUsed() + ' / ' + pl.cargoMax + '</span></div></div>'
    + mapSVG()
    + (game.mission ? '<p class="small muted" style="margin-top:8px">Задание: ' + game.mission.title + ', система ' + SYSTEMS[game.mission.sys].name + '.</p>' : '')
    + '<h2>В этой системе</h2><div class="dest">' + local.join('') + '</div>'
    + '<h2>Прыжок в соседнюю систему</h2><div class="dest">' + jumps.join('') + '</div>'
    + '<div class="actions"><button class="btn" data-act="closenav">Закрыть</button></div>'
  );
}

function showStation(){
  const sysId = game.sys, s = SYSTEMS[sysId], st = shipStats(game.active);
  let body = '';
  if (stationTab === 'missions'){
    if (game.mission){
      const m = game.mission;
      body += '<div class="item"><div class="row"><b>Текущее: ' + m.title + '</b><span class="reward">' + fmtNum(m.reward) + ' кр</span></div><p class="small muted">Уровень ' + m.level + ', система ' + SYSTEMS[m.sys].name + ' ' + secBadge(m.sys) + '</p>' + enemyLines(m.comp) + '<button class="btn" data-act="abandon">Отказаться</button></div>';
    }
    body += '<h2>Доска заданий</h2>';
    for (const m of game.boards[sysId] || []){
      body += '<div class="item"><div class="row"><b>' + m.title + '</b><span class="reward">' + fmtNum(m.reward) + ' кр</span></div><p class="small muted">Уровень ' + m.level + ', система ' + SYSTEMS[m.sys].name + ' ' + secBadge(m.sys) + '</p>' + enemyLines(m.comp)
        + '<button class="btn' + (game.mission ? '' : ' on') + '" data-act="accept" data-id="' + m.id + '"' + (game.mission ? ' disabled' : '') + '>' + (game.mission ? 'Сначала заверши текущее' : 'Взять задание') + '</button></div>';
    }
  } else if (stationTab === 'hangar'){
    body += '<h2>Корабли</h2>';
    for (const [id, S] of Object.entries(SHIPS)){
      const owned = game.ships[id], active = game.active === id;
      const btn = active ? '<button class="btn on" disabled>Выбран</button>' : owned ? '<button class="btn" data-act="selship" data-ship="' + id + '">Выбрать</button>' : '<button class="btn" data-act="buyship" data-ship="' + id + '"' + (game.credits < S.price ? ' disabled' : '') + '>Купить за ' + fmtNum(S.price) + ' кр</button>';
      body += '<div class="item"><div class="row"><b>' + S.name + '</b><span class="muted small">' + S.slots.weapon + ' оруж. · ' + S.slots.def + ' защ. · ' + S.slots.util + ' всп.</span></div><p class="small muted" style="margin:4px 0 0">' + S.desc + '</p>' + btn + '</div>';
    }
    body += '<h2>Фит: ' + SHIPS[game.active].name + '</h2>';
    const f = game.fits[game.active];
    for (const kind of ['weapon','def','util']){
      f[kind].forEach((cur, idx) => {
        const opts = OPTIONS[kind].map(mod => {
          const M = MODULES[mod], own = game.owned[mod], on = cur === mod;
          const sub = own ? M.desc : 'Купить: ' + fmtNum(M.price) + ' кр';
          return '<button class="btn opt' + (on ? ' on' : '') + '" data-act="fit" data-kind="' + kind + '" data-idx="' + idx + '" data-mod="' + mod + '" aria-pressed="' + on + '"><span>' + M.name + '</span>' + (sub ? '<small>' + sub + '</small>' : '') + '</button>';
        }).join('');
        body += '<div class="slot"><span>' + SLOT_LABEL[kind] + (f[kind].length > 1 ? ' ' + (idx + 1) : '') + '</span><div class="opts">' + opts + '</div></div>';
      });
    }
    body += '<div class="stats"><span>Броня <b>' + st.armor + '</b></span><span>Корпус <b>' + st.hull + '</b></span><span>Скорость <b>' + Math.round(st.speed) + '</b></span><span>Трюм <b>' + st.cargo + '</b></span></div>';
    if (game.fits[game.active].util.includes('repair') && st.armor === 0) body += '<p class="note">Без броневой плиты ремонту нечего чинить.</p>';
    if (flash) body += '<p class="note">' + flash + '</p>';
    body += '<button class="linkbtn" data-act="reset">' + (resetArm ? 'Точно начать заново? Нажми ещё раз' : 'Начать игру заново') + '</button>';
  } else {
    const prices = PRICES[sysId];
    body += '<h2>Продажа руды</h2>';
    for (const ore of Object.keys(ORES)){
      const have = game.cargo[ore], other = Object.entries(PRICES).filter(([k]) => k !== sysId).map(([k, v]) => SYSTEMS[k].station + ': ' + v[ore] + ' кр').join(', ');
      body += '<div class="item"><div class="row"><b style="color:' + ORES[ore].color + '">' + ORES[ore].name + '</b><span>' + prices[ore] + ' кр за ед.</span></div><p class="small muted">В трюме ' + have + ' ед. ' + (other ? 'Цена на ' + other + '.' : '') + '</p>'
        + '<button class="btn' + (have ? ' on' : '') + '" data-act="sell" data-ore="' + ore + '"' + (have ? '' : ' disabled') + '>' + (have ? 'Продать за ' + fmtNum(have * prices[ore]) + ' кр' : 'Нечего продавать') + '</button></div>';
    }
  }
  showOverlay(
    '<div class="sthead"><div><h1>' + s.station + '</h1><p class="muted">Система ' + s.name + ' ' + secBadge(sysId) + '</p></div><div class="wallet"><b>' + fmtNum(game.credits) + ' кр</b><span>Трюм ' + cargoUsed() + ' / ' + st.cargo + '</span></div></div>'
    + '<div class="tabs">' + [['missions','Задания'],['hangar','Ангар'],['market','Рынок']].map(([k, n]) => '<button class="btn' + (stationTab === k ? ' on' : '') + '" data-act="tab" data-tab="' + k + '">' + n + '</button>').join('') + '</div>'
    + body
    + '<div class="actions"><button class="btn on" data-act="undock">Вылет</button></div>'
  );
}

overlay.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.act !== 'reset') resetArm = false;
  if (d.act !== 'fit') flash = '';
  switch (d.act){
    case 'tab': stationTab = d.tab; showStation(); break;
    case 'undock':
      if (cargoUsed() > shipStats(game.active).cargo){ flash = 'Груз не помещается в трюм этого корабля. Продай руду или выбери другой корабль.'; stationTab = 'hangar'; showStation(); break; }
      undock(); break;
    case 'accept': {
      const board = game.boards[game.sys], i = board.findIndex(m => m.id === +d.id);
      if (i >= 0 && !game.mission){ game.mission = board.splice(i, 1)[0]; ensureBoard(game.sys); save(); log('Взято задание: ' + game.mission.title); }
      showStation(); break;
    }
    case 'abandon': game.mission = null; save(); showStation(); break;
    case 'selship': game.active = d.ship; save(); showStation(); break;
    case 'buyship': {
      const S = SHIPS[d.ship];
      if (game.credits >= S.price){ game.credits -= S.price; game.ships[d.ship] = true; game.active = d.ship; save(); log('Куплен ' + S.name); }
      showStation(); break;
    }
    case 'fit': {
      const M = MODULES[d.mod];
      if (!game.owned[d.mod]){
        if (game.credits < M.price){ flash = 'Не хватает кредитов на «' + M.name + '»: нужно ' + fmtNum(M.price) + ' кр.'; showStation(); break; }
        game.credits -= M.price; game.owned[d.mod] = true; log('Куплен модуль: ' + M.name);
      }
      flash = '';
      game.fits[game.active][d.kind][+d.idx] = d.mod; save(); showStation(); break;
    }
    case 'sell': {
      const q = game.cargo[d.ore], sum = q * PRICES[game.sys][d.ore];
      game.credits += sum; game.cargo[d.ore] = 0; save(); log('Продано ' + q + ' ед. ' + ORES[d.ore].short + ' за ' + fmtNum(sum) + ' кр');
      showStation(); break;
    }
    case 'reset':
      if (!resetArm){ resetArm = true; showStation(); break; }
      resetArm = false; game = newGame(); ensureBoard('alpha'); save(); logs = []; logDirty = true; stationTab = 'missions'; showStation(); break;
    case 'warp': {
      const labels = { station:'станция', belt:'пояс астероидов', mission:'место задания' };
      hideOverlay(); startWarp({ type:'local', loc:d.loc, label:labels[d.loc] }); break;
    }
    case 'jump': hideOverlay(); startWarp({ type:'jump', sys:d.sys }); break;
    case 'closenav': hideOverlay(); break;
    case 'tostation': dock(); break;
  }
  updateUI();
});

/* ================= loop ================= */
let last = performance.now(), acc = 0, uiT = 0;
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (pl){
    acc += dt * TIME_SCALE; const step = 1/60;
    while (acc >= step){ update(step); acc -= step; if (!pl){ acc = 0; break; } }
  }
  render(now);
  uiT -= dt; if (uiT <= 0){ updateUI(); uiT = 0.15; }
  requestAnimationFrame(frame);
}
ensureBoard(game.sys);
log('Ты на станции ' + SYSTEMS[game.sys].station);
showStation();
updateUI();
requestAnimationFrame(frame);
})();
</script>
